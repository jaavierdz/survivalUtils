name: survivalUtils
version: '${version}'

main: es.javierdz.survivalUtils.SurvivalUtils
api-version: '26.1'

commands:
  toggleend:
    description: Activa o desactiva el acceso al End.
    usage: /toggleend
  ping:
    description: te dice tu ping.
    usage: /ping [jugador]
  coords:
    description: broadcast de tus coordenadas
    usage: /coords [nota]
  evento:
    description: gestiona los eventos
    usage: /evento <iniciar|terminar|freeze|tpall>